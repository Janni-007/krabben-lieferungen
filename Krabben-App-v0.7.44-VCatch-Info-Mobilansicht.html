<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Krabben-Lieferungen v0.7.44 VCatch-Info und Mobilansicht</title>
<style>html,body{margin:0;min-height:100%;font-family:system-ui,Segoe UI,Arial,sans-serif;background:#eef4f7}#loader{padding:24px;text-align:center;color:#173042;font-weight:800}#loader.err{color:#8a2d2d}</style>
</head>
<body>
<div id="loader">Krabben-Lieferungen v0.7.44 wird geladen …</div>
<script>
(async function(){
 const localBase='Krabben-App-v0.7.43-Bedienung-Produktgewicht.html';
 const onlineBase='https://janni-007.github.io/krabben-lieferungen/Krabben-App-v0.7.43-Bedienung-Produktgewicht.html';
 let html='';
 try{
   let res=await fetch(localBase,{cache:'no-store'});
   if(!res.ok)throw new Error('lokale Basis nicht gefunden');
   html=await res.text();
 }catch(firstErr){
   try{
     const res=await fetch(onlineBase,{cache:'no-store'});
     if(!res.ok)throw new Error('Online-Basis nicht gefunden');
     html=await res.text();
   }catch(err){
     const el=document.getElementById('loader');el.className='err';el.textContent='v0.7.44 konnte die Basis v0.7.43 nicht laden. Internetverbindung bzw. GitHub Pages prüfen.';return;
   }
 }
 html=html.replaceAll('0.7.43','0.7.44');
 html=html.replaceAll('Bedienung und Produktgewicht','VCatch-Info und Mobilansicht');
 const extraCss="\n/* v0.7.44: VCatch-Schnellinfo + mobile Monatsansicht */\n.vcatch-row-open td:not(:has(button)){cursor:pointer}\n.vcatch-row-open:hover td{filter:brightness(.985)}\n.vcatch-read-modal{position:fixed;inset:0;z-index:2500;background:rgba(14,35,47,.55);display:flex;align-items:center;justify-content:center;padding:14px}\n.vcatch-read-modal.hidden{display:none!important}\n.vcatch-read-card{width:min(760px,96vw);max-height:92vh;overflow:auto;background:#fff;border-radius:15px;box-shadow:0 20px 60px rgba(0,0,0,.28)}\n.vcatch-read-head{position:sticky;top:0;z-index:3;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 15px;background:#0f6f91;color:#fff}\n.vcatch-read-head strong{display:block;font-size:1.05rem}.vcatch-read-head small{display:block;opacity:.85;margin-top:2px}.vcatch-read-head button{border:1px solid #ffffff66;background:#ffffff18;color:#fff;border-radius:8px;padding:7px 10px;font-weight:900}\n.vcatch-read-body{padding:13px}.vcatch-read-primary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}\n.vcatch-read-item{border:1px solid #d4e0e6;background:#f8fbfc;border-radius:10px;padding:8px 9px}.vcatch-read-item span{display:block;font-size:.68rem;font-weight:850;color:#667b87}.vcatch-read-item strong{display:block;margin-top:3px;font-size:.9rem;color:#173042}\n.vcatch-read-item.focus{background:#e7f2f6;border-color:#9fc2d1}.vcatch-read-item.product{background:#dcefe5;border-color:#9bc8ae}.vcatch-read-item.sieve{background:#fff5cf;border-color:#e2c46c}\n.vcatch-read-rule{margin-top:9px;padding:8px 10px;border-radius:9px;background:#fff8df;border:1px solid #ead386;font-size:.76rem;color:#654d0b}.vcatch-read-details{margin-top:12px;border-top:2px solid #d4e0e6;padding-top:10px}.vcatch-read-subtitle{font-size:.75rem;font-weight:950;color:#506b78;text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px}\n@media(max-width:700px){\n .month-quick-grid .mq-rowhead{position:static!important;left:auto!important;z-index:auto!important;min-width:115px!important}\n .month-quick-grid{grid-template-columns:115px repeat(12,minmax(100px,1fr))!important;min-width:1315px!important}\n .month-quick-grid>div{scroll-margin-left:0!important}\n .vcatch-read-primary{grid-template-columns:repeat(2,minmax(0,1fr))}\n .vcatch-read-card{width:98vw;max-height:94vh}\n}\n@media(max-width:430px){.vcatch-read-primary{grid-template-columns:1fr 1fr}.vcatch-read-item{padding:7px}.vcatch-read-item strong{font-size:.82rem}}\n";
 const patchJs="(function(){\n  'use strict';\n\n  const fmtDT=v=>{\n    if(!v)return '\u2013';\n    const d=new Date(v);\n    return Number.isNaN(d.getTime())?'\u2013':d.toLocaleString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});\n  };\n  const fmtKg=v=>`${num(Number(v)||0)} kg`;\n  const escapeHtml=v=>String(v??'').replace(/[&<>\"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[ch]));\n\n  function departureSortValue(r){\n    if(r?.departureAt){const t=new Date(r.departureAt).getTime();if(Number.isFinite(t))return t;}\n    const date=r?.date||r?.supplier||'';\n    const t=date?new Date(date+'T00:00:00').getTime():0;\n    return Number.isFinite(t)?t:0;\n  }\n  function tripSortValue(r){\n    const label=typeof displayTripNumbersForRecord==='function'?String(displayTripNumbersForRecord(r)||''):'';\n    const nums=label.match(/\\d+/g)||[];\n    return nums.length?Number(nums[nums.length-1])||0:0;\n  }\n\n  const renderList744=function(){\n    const q=$('search').value.toLowerCase(),y=+$('listYear').value,m=$('listMonth').value;\n    const arr=filtered(y,m)\n      .filter(r=>[r.date,r.departureAt,r.arrivalAt,r.receipt,r.note,r.supplier,r.reportType,reportTypeLabel(r.reportType)].join(' ').toLowerCase().includes(q))\n      .sort((a,b)=>departureSortValue(b)-departureSortValue(a)||tripSortValue(b)-tripSortValue(a)||String(b.date||'').localeCompare(String(a.date||'')));\n    $('allTable').innerHTML=table(arr);\n    $('allTable').querySelectorAll('tbody tr').forEach(tr=>tr.classList.add('vcatch-row-open'));\n  };\n  try{renderList=renderList744}catch(_e){}\n  window.renderList=renderList744;\n\n  function ensureVcatchModal(){\n    if(document.getElementById('vcatchReadModal'))return;\n    const modal=document.createElement('div');\n    modal.id='vcatchReadModal';\n    modal.className='vcatch-read-modal hidden';\n    modal.innerHTML=`<div class=\"vcatch-read-card\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"vcatchReadTitle\">\n      <div class=\"vcatch-read-head\"><div><strong id=\"vcatchReadTitle\">vCatch-Info</strong><small>Schnellansicht f\u00fcr das Logbuch</small></div><button type=\"button\" id=\"vcatchReadClose\" aria-label=\"Schlie\u00dfen\">\u2715</button></div>\n      <div class=\"vcatch-read-body\" id=\"vcatchReadBody\"></div>\n    </div>`;\n    document.body.appendChild(modal);\n    document.getElementById('vcatchReadClose').onclick=closeVcatchInfo;\n    modal.addEventListener('click',e=>{if(e.target===modal)closeVcatchInfo()});\n  }\n  function closeVcatchInfo(){document.getElementById('vcatchReadModal')?.classList.add('hidden')}\n\n  function openVcatchInfo(id){\n    const source=records.find(x=>String(x.id)===String(id));\n    if(!source)return;\n    const r=normalize(source);\n    ensureVcatchModal();\n\n    const tripLabel=typeof displayTripNumbersForRecord==='function'?(displayTripNumbersForRecord(r)||'\u2013'):'\u2013';\n    const boxWeight=Number(r.boxWeight)||Number(settings?.boxWeight)||17;\n    const sieveKg=Number(r.waste)||0;\n    const sieveCrates=boxWeight>0?Math.round(sieveKg/boxWeight):0;\n    const productKg=Number(r.weight)||((r.sorts||[]).reduce((s,x)=>s+(Number(x?.weight)||0),0));\n    const catchKg=Number(r.catchWeight)||(productKg+sieveKg);\n    const vcatchCrates=Number(r.vcatchBoxesRounded)||0;\n    const caughtCrates=Number(r.manualCrates)||0;\n    const liveKg=typeof liveWeightForRecord==='function'?Number(liveWeightForRecord(r))||0:Number(r.estimatedLiveWeight)||0;\n    const normal=typeof infoPanelSections==='function'?infoPanelSections(r,'saved'):null;\n\n    const grid=(label,value,focus='')=>`<div class=\"vcatch-read-item ${focus}\"><span>${label}</span><strong>${value}</strong></div>`;\n    document.getElementById('vcatchReadTitle').textContent=`vCatch-Info \u00b7 Reise ${tripLabel}`;\n    document.getElementById('vcatchReadBody').innerHTML=`\n      <div class=\"vcatch-read-primary\">\n        ${grid('Reise-Nr.',escapeHtml(tripLabel),'focus')}\n        ${grid('Auslaufen',fmtDT(r.departureAt))}\n        ${grid('Einlaufen',fmtDT(r.arrivalAt))}\n        ${grid('DEU-Nr.',escapeHtml(r.receipt||'\u2013'),'focus')}\n        ${grid('vCatch-Kisten',`${vcatchCrates} Kisten`,'focus')}\n        ${grid('Kisten gefangen',`${num(caughtCrates)} Kisten`)}\n        ${grid('Lebendgewicht',liveKg>0?fmtKg(liveKg):'\u2013')}\n        ${grid('Produktgewicht',fmtKg(productKg),'product')}\n        ${grid('Sieb',fmtKg(sieveKg),'sieve')}\n        ${grid('Sieb-Kisten',`${sieveCrates} Kisten`,'sieve')}\n        ${grid('kg je Kiste',`${num2(boxWeight)} kg`)}\n        ${grid('Anlandegewicht inkl. Sieb',fmtKg(catchKg))}\n      </div>\n      <div class=\"vcatch-read-rule\">Sieb-Kisten: ${num2(sieveKg)} kg \u00f7 ${num2(boxWeight)} kg/Kiste = ${num2(boxWeight>0?sieveKg/boxWeight:0)} \u2192 <b>${sieveCrates} Kisten</b> (normal gerundet)</div>\n      ${normal?.top?`<div class=\"vcatch-read-details\"><div class=\"vcatch-read-subtitle\">Lieferdetails</div>${normal.top}</div>`:''}`;\n    document.getElementById('vcatchReadModal').classList.remove('hidden');\n  }\n  window.openVcatchInfo=openVcatchInfo;\n  window.closeVcatchInfo=closeVcatchInfo;\n\n  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeVcatchInfo()});\n  document.getElementById('allTable')?.addEventListener('click',e=>{\n    const tr=e.target.closest('tbody tr');\n    if(!tr)return;\n    const actionable=e.target.closest('button,a,input,select');\n    if(actionable)return;\n    const editBtn=tr.querySelector('button[onclick*=\"editRecord\"]');\n    const raw=editBtn?.getAttribute('onclick')||'';\n    const match=raw.match(/editRecord\\(['\\\"]([^'\\\"]+)['\\\"]\\)/);\n    if(match)openVcatchInfo(match[1]);\n  });\n\n  // Auf mobilen Ger\u00e4ten ist die linke Monats-Spalte bewusst nicht sticky,\n  // damit sie beim horizontalen Scrollen keine Monatswerte verdeckt.\n  try{renderList744()}catch(_e){}\n})();\n";
 html=html.replace('</head>','<style>'+extraCss+'</style></head>');
 html=html.replace('</body>','<script>'+patchJs+'<\/script></body>');
 document.open();document.write(html);document.close();
})();
</script>
</body>
</html>
